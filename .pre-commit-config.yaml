# Rendering the tutorials needs Inkscape, which is not available on pre-commit.ci.
ci:
  skip: [stepup-handson]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
      args: ["--maxkb=1024"]
    - id: check-ast
    - id: check-case-conflict
    - id: check-executables-have-shebangs
    - id: check-json
    - id: check-merge-conflict
    - id: check-symlinks
    - id: check-vcs-permalinks
    - id: check-yaml
    - id: debug-statements
    - id: detect-private-key
    - id: destroyed-symlinks
    - id: end-of-file-fixer
    - id: fix-byte-order-marker
    - id: mixed-line-ending
    - id: pretty-format-json
      args: ["--autofix", "--no-sort-keys"]
    - id: trailing-whitespace
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.6
  hooks:
    - id: remove-crlf
      exclude_types: [binary]
- repo: https://github.com/hukkin/mdformat
  rev: 1.0.0
  hooks:
  - id: mdformat
    # Jinja placeholders in link destinations are not valid Markdown.
    # The rendered tutorials are checked instead (see the stepup-handson hook).
    exclude: ^handson/\.template/
    additional_dependencies:
      - mdformat-gfm
      - mdformat-ruff
      - mdformat-config
- repo: https://github.com/fsfe/reuse-tool
  rev: v6.2.0
  hooks:
  - id: reuse
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.39.0
  hooks:
    - id: check-github-workflows
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.2
  hooks:
    - id: ruff-format
    - id: ruff-check
      args: ["--fix", "--show-fixes"]
- repo: local
  hooks:
    # Render the tutorials from their templates and let pre-commit fail
    # when this modifies the committed files in handson/.
    - id: stepup-handson
      name: render hands-on tutorials
      entry: uv run stepup build --no-progress handson/
      language: system
      files: ^(handson/|plan\.py$|bakesvg\.py$|pyproject\.toml$)
      pass_filenames: false
