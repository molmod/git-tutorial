name: Publish Slides

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Fonts used by the UGentish templates.
      # (Typst finds them in ~/.local/share/fonts)
      - name: Download and install fonts
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL https://github.com/adobe-fonts/source-sans/releases/download/3.052R/TTF-source-sans-3.052R.zip -o source-sans.zip
          curl -fsSL "https://github.com/adobe-fonts/source-code-pro/releases/download/2.042R-u/1.062R-i/1.026R-vf/TTF-source-code-pro-2.042R-u_1.062R-i.zip" -o source-code-pro.zip
          curl -fsSL https://mirrors.ctan.org/fonts/erewhon-math.zip -o erewhon-math.zip
          unzip -j -o -q source-sans.zip "TTF/*.ttf" -d ~/.local/share/fonts
          unzip -j -o -q source-code-pro.zip "TTF/*.ttf" -d ~/.local/share/fonts
          unzip -j -o -q erewhon-math.zip "erewhon-math/*.otf" -d ~/.local/share/fonts
          fc-cache -f

      - name: Install Typst 0.15.1
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      # UGentish is not available on Typst Universe (yet), so it is cloned.
      # Other packages, such as Animo, are downloaded by Typst from Universe.
      # See README.md for the same steps on a local machine.
      - name: Install UGentish Typst packages
        run: |
          git clone --depth 1 \
            https://github.com/reproducible-reporting/ugentish.git \
            .typst-packages/ugentish

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create Python environment with StepUp
        run: uv sync

      - name: Run the StepUp workflow
        run: uv run stepup build

      # The rendered tutorials are committed, so participants can read them on GitHub.
      # This step fails when they are out of sync with their templates.
      - name: Check that the rendered tutorials are up to date
        run: |
          git status --porcelain handson/
          test -z "$(git status --porcelain handson/)"

      - name: Upload slides artifact
        uses: actions/upload-artifact@v7
        with:
          name: slides
          path: |
            slides.pdf
            slides.html

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download slides artifact
        uses: actions/download-artifact@v8
        with:
          name: slides

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            slides.pdf
            slides.html
