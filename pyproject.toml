[project]
name = "git-tutorial"
version = "0.0.0"
description = "Slides and hands-on tutorials of the CMM Git(Hub) tutorial"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pre-commit>=4.6.0",
    "stepup>=4.0.3",
    "stepup-reprep>=4.0.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I", "PGH", "PL", "RUF"]
ignore = ["E741", "PLR2004", "PLR0913", "PLR0912", "PLW2901", "PLR0915", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"cool_stuff/sympy.ipynb" = ["F403", "F405"]
